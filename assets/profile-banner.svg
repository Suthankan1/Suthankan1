<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Suthankan Balenthiran</title>
  <desc id="bannerDesc">Personal header for Suthankan Balenthiran - Software Engineer, Backend and Distributed Systems.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanRadial" cx="85%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleRadial" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="320" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="14" fill="url(#cyanRadial)" />
  <rect width="1200" height="320" rx="14" fill="url(#purpleRadial)" />
  <rect width="1200" height="320" rx="14" fill="url(#dotPattern)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGlow)" />

  <!-- Content Group -->
  <g transform="translate(64, 48)">
    <!-- Top Pill: Academic & Role Badge -->
    <g>
      <rect width="360" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#34D399" />
      <text x="30" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        University of Moratuwa · BSc (Hons) IT · <tspan fill="#38BDF8">GPA 3.74</tspan>
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">
      Suthankan Balenthiran
    </text>

    <!-- Subtitle / Passion -->
    <text x="0" y="128" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">
      Backend &amp; Distributed Systems <tspan fill="#64748B" font-weight="400">·</tspan> Cloud Platform Engineering
    </text>

    <!-- One-line Summary -->
    <text x="0" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">
      Architecting high-throughput event pipelines, zero-trust security services, and resilient microservices.
    </text>

    <!-- Key Core Skills -->
    <g transform="translate(0, 192)">
      <!-- Java -->
      <g transform="translate(0, 0)">
        <rect width="84" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="42" y="19" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Java 25</text>
      </g>
      <!-- Go -->
      <g transform="translate(94, 0)">
        <rect width="64" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="32" y="19" text-anchor="middle" fill="#00ADD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Go</text>
      </g>
      <!-- .NET -->
      <g transform="translate(168, 0)">
        <rect width="88" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="44" y="19" text-anchor="middle" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">C# / .NET 10</text>
      </g>
      <!-- Kafka -->
      <g transform="translate(266, 0)">
        <rect width="78" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="39" y="19" text-anchor="middle" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Kafka</text>
      </g>
      <!-- Postgres -->
      <g transform="translate(354, 0)">
        <rect width="104" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="52" y="19" text-anchor="middle" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">PostgreSQL</text>
      </g>
      <!-- Docker & AWS -->
      <g transform="translate(468, 0)">
        <rect width="120" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="60" y="19" text-anchor="middle" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Docker &amp; AWS</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Abstract Tech Badge -->
  <g transform="translate(860, 56)">
    <rect width="276" height="208" rx="12" fill="#0D1527" stroke="#1E293B" stroke-width="1.2" />
    
    <g transform="translate(24, 28)">
      <circle cx="8" cy="8" r="5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="12" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">STATUS: AVAILABLE</text>

      <text x="0" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">
        Internship Seeking
      </text>
      <text x="0" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Software Engineering · Backend
      </text>
      <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Platform · DevOps
      </text>

      <line x1="0" y1="104" x2="228" y2="104" stroke="#1E293B" stroke-width="1" />

      <text x="0" y="126" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        📍 Sri Lanka / Remote Worldwide
      </text>
      <text x="0" y="146" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Telegram &amp; Testcontainers Contributor
      </text>
    </g>
  </g>
</svg>
