<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" style="background: #090d16; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="arcadeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="cabinetGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseStart {
      0% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.85; transform: scale(1); }
    }
    .start-btn {
      animation: pulseStart 2s ease-in-out infinite;
      transform-origin: 770px 110px;
    }
  </style>

  <!-- Arcade Outer Frame -->
  <rect width="960" height="220" fill="url(#cabinetGlow)" stroke="url(#arcadeBorder)" stroke-width="2" rx="14" />

  <!-- Pixel Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="36" x2="960" y2="36" />
    <line x1="0" y1="72" x2="960" y2="72" />
    <line x1="0" y1="108" x2="960" y2="108" />
    <line x1="0" y1="144" x2="960" y2="144" />
    <line x1="0" y1="180" x2="960" y2="180" />
  </g>

  <!-- Arcade CRT Top Marquee -->
  <g transform="translate(40, 32)">
    <rect width="210" height="22" rx="4" fill="#030712" stroke="#f43f5e" stroke-width="1" />
    <text x="12" y="15" fill="#f43f5e" font-size="9" font-weight="900" letter-spacing="2">ARCADE SYSTEM // 60 FPS</text>
  </g>

  <!-- Game Title & Subtitle -->
  <g transform="translate(40, 85)">
    <text x="0" y="0" fill="#f8fafc" font-size="28" font-weight="900" letter-spacing="1">🎮 DEVRACER: THE CAR GAME PORTFOLIO</text>
    <text x="0" y="24" fill="#38bdf8" font-size="13" font-weight="700">Drive through Suthankan's Tech Stacks, Project Blocks, and EV Charging Stations!</text>
  </g>

  <!-- Control Key Badges -->
  <g transform="translate(40, 150)">
    <text x="0" y="16" fill="#94a3b8" font-size="10" font-weight="800">CONTROLS:</text>
    
    <!-- WASD / Arrows -->
    <rect x="75" y="0" width="105" height="24" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="127" y="16" fill="#f8fafc" font-size="9.5" font-weight="800" text-anchor="middle">WASD / ARROWS</text>

    <!-- Space Nitro -->
    <rect x="190" y="0" width="95" height="24" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
    <text x="237" y="16" fill="#f8fafc" font-size="9.5" font-weight="800" text-anchor="middle">SPACE (NITRO)</text>

    <!-- E Inspect -->
    <rect x="295" y="0" width="115" height="24" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="352" y="16" fill="#f8fafc" font-size="9.5" font-weight="800" text-anchor="middle">E (INSPECT BAY)</text>

    <!-- T Autopilot -->
    <rect x="420" y="0" width="125" height="24" rx="5" fill="#0f172a" stroke="#facc15" stroke-width="1" />
    <text x="482" y="16" fill="#f8fafc" font-size="9.5" font-weight="800" text-anchor="middle">T (AUTOPILOT TOUR)</text>
  </g>

  <!-- PLAY BUTTON / LAUNCH CTA (Clickable Link) -->
  <a href="https://suthankan1.github.io/Suthankan1/" target="_blank">
    <g class="start-btn" transform="translate(640, 75)">
      <rect width="260" height="70" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#btnGlow)" />
      <!-- Inner Gradient Accent -->
      <rect x="4" y="4" width="252" height="62" rx="10" fill="#0369a1" />
      <text x="130" y="32" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ START ENGINE</text>
      <text x="130" y="52" fill="#bae6fd" font-size="11" font-weight="800" text-anchor="middle">PLAY GAME IN BROWSER &gt;&gt;</text>
    </g>
  </a>
</svg>
