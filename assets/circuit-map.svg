<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%" style="background: #090d16; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="circuitBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>

    <linearGradient id="neonTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePoint {
      0% { r: 6px; opacity: 1; }
      50% { r: 10px; opacity: 0.5; }
      100% { r: 6px; opacity: 1; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .track-active {
      stroke-dasharray: 12, 12;
      animation: dashMove 2.5s linear infinite;
    }
    .checkpoint-pulse {
      animation: pulsePoint 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="440" fill="url(#circuitBg)" />

  <!-- Subtle Circuit Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="80" y1="40" x2="80" y2="400" />
    <line x1="200" y1="40" x2="200" y2="400" />
    <line x1="320" y1="40" x2="320" y2="400" />
    <line x1="480" y1="40" x2="480" y2="400" />
    <line x1="640" y1="40" x2="640" y2="400" />
    <line x1="780" y1="40" x2="780" y2="400" />
    <line x1="880" y1="40" x2="880" y2="400" />

    <line x1="40" y1="80" x2="920" y2="80" />
    <line x1="40" y1="180" x2="920" y2="180" />
    <line x1="40" y1="280" x2="920" y2="280" />
    <line x1="40" y1="380" x2="920" y2="380" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(50, 42)">
    <rect width="320" height="34" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f43f5e" filter="url(#pointGlow)" />
    <text x="32" y="16" fill="#f8fafc" font-size="11" font-weight="900" letter-spacing="1">BALENTHIRAN GRAND PRIX</text>
    <text x="32" y="27" fill="#38bdf8" font-size="8" font-weight="700" letter-spacing="1.5">CIRCUIT TELEMETRY MAP // 2026</text>
  </g>

  <!-- Circuit Stats Badge -->
  <g transform="translate(680, 42)">
    <rect width="230" height="34" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="16" fill="#94a3b8" font-size="8" font-weight="700">TRACK LENGTH</text>
    <text x="16" y="27" fill="#10b981" font-size="9" font-weight="900">8 SECTORS • 4 PIT STOPS</text>
    <text x="140" y="16" fill="#94a3b8" font-size="8" font-weight="700">LAP RECORD</text>
    <text x="140" y="27" fill="#38bdf8" font-size="9" font-weight="900">GPA 3.74 / 4.0</text>
  </g>

  <!-- CIRCUIT TRACK PATH DEFINITION -->
  <!-- Wide Track Base (Asphalt) -->
  <path id="trackPath" d="M 120 220 C 120 120, 220 90, 360 90 C 500 90, 560 140, 680 110 C 800 80, 880 140, 880 230 C 880 340, 780 380, 620 370 C 480 360, 420 310, 320 320 C 200 330, 120 300, 120 220 Z" 
        fill="none" stroke="#020617" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 120 220 C 120 120, 220 90, 360 90 C 500 90, 560 140, 680 110 C 800 80, 880 140, 880 230 C 880 340, 780 380, 620 370 C 480 360, 420 310, 320 320 C 200 330, 120 300, 120 220 Z" 
        fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neon Glowing Track Rail -->
  <path d="M 120 220 C 120 120, 220 90, 360 90 C 500 90, 560 140, 680 110 C 800 80, 880 140, 880 230 C 880 340, 780 380, 620 370 C 480 360, 420 310, 320 320 C 200 330, 120 300, 120 220 Z" 
        fill="none" stroke="url(#neonTrackGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#trackGlow)" />

  <!-- Animated Active Centerline -->
  <path d="M 120 220 C 120 120, 220 90, 360 90 C 500 90, 560 140, 680 110 C 800 80, 880 140, 880 230 C 880 340, 780 380, 620 370 C 480 360, 420 310, 320 320 C 200 330, 120 300, 120 220 Z" 
        fill="none" stroke="#ffffff" stroke-width="2" class="track-active" opacity="0.8" />

  <!-- ANIMATED CAR RACING ON TRACK -->
  <g>
    <circle r="7" fill="#f43f5e" filter="url(#pointGlow)" />
    <circle r="3.5" fill="#ffffff" />
    <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trackPath" />
    </animateMotion>
  </g>

  <!-- PIT STOPS & CHECKPOINTS (CLICKABLE HOTSPOTS) -->

  <!-- CHECKPOINT 1: THE ENGINE BAY (Java 25, Go, C# .NET) -->
  <g transform="translate(190, 60)">
    <rect x="-10" y="-12" width="160" height="42" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="6" cy="9" r="5" fill="#38bdf8" class="checkpoint-pulse" />
    <text x="18" y="4" fill="#38bdf8" font-size="8" font-weight="900">TURN 1-2 // ENGINE STRAIGHT</text>
    <text x="18" y="16" fill="#f8fafc" font-size="10" font-weight="800">Java 25 • Go • C# .NET 10</text>
    <text x="18" y="25" fill="#94a3b8" font-size="7.5" font-weight="600">Spring Boot 4, ASP.NET Core</text>
  </g>

  <!-- CHECKPOINT 2: EVENT STREAM CHICANE (Kafka, gRPC, Outbox) -->
  <g transform="translate(430, 70)">
    <rect x="-10" y="-12" width="155" height="42" rx="8" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
    <circle cx="6" cy="9" r="5" fill="#10b981" class="checkpoint-pulse" />
    <text x="18" y="4" fill="#10b981" font-size="8" font-weight="900">SECTOR 2 // EVENT CHICANE</text>
    <text x="18" y="16" fill="#f8fafc" font-size="10" font-weight="800">Kafka • gRPC • Protobuf</text>
    <text x="18" y="25" fill="#94a3b8" font-size="7.5" font-weight="600">Transactional Outbox Patterns</text>
  </g>

  <!-- PIT STOP 1: VOLTGRID MEGASTATION (EV Charging Platform) -->
  <a href="https://github.com/Suthankan1/voltgrid" target="_blank">
    <g transform="translate(740, 110)">
      <rect x="-12" y="-14" width="170" height="48" rx="8" fill="#061e38" stroke="#38bdf8" stroke-width="1.8" filter="url(#pointGlow)" />
      <circle cx="6" cy="10" r="6" fill="#38bdf8" class="checkpoint-pulse" />
      <text x="18" y="4" fill="#38bdf8" font-size="8" font-weight="900">PIT STOP 1 ⚡ [CLICK REPO]</text>
      <text x="18" y="18" fill="#ffffff" font-size="11" font-weight="900">VOLTGRID EV STATION</text>
      <text x="18" y="28" fill="#7dd3fc" font-size="7.5" font-weight="700">3x Spring Microservices, OCPP 2.0.1</text>
    </g>
  </a>

  <!-- CHECKPOINT 4: PROOFMESH CITADEL (Security Hairpin) -->
  <a href="https://github.com/Suthankan1/proofmesh" target="_blank">
    <g transform="translate(740, 275)">
      <rect x="-12" y="-14" width="170" height="48" rx="8" fill="#1f1135" stroke="#c084fc" stroke-width="1.8" filter="url(#pointGlow)" />
      <circle cx="6" cy="10" r="6" fill="#c084fc" class="checkpoint-pulse" />
      <text x="18" y="4" fill="#c084fc" font-size="8" font-weight="900">SECTOR 3 🛡️ [CLICK REPO]</text>
      <text x="18" y="18" fill="#ffffff" font-size="11" font-weight="900">PROOFMESH CITADEL</text>
      <text x="18" y="28" fill="#e9d5ff" font-size="7.5" font-weight="700">Zero-Trust Agent Runtime, ES256</text>
    </g>
  </a>

  <!-- CHECKPOINT 5: SETTLECORE BANKING (Financial Banking) -->
  <a href="https://github.com/Suthankan1/SettleCore" target="_blank">
    <g transform="translate(480, 360)">
      <rect x="-10" y="-12" width="165" height="44" rx="8" fill="#04221b" stroke="#10b981" stroke-width="1.8" />
      <circle cx="6" cy="10" r="5" fill="#10b981" class="checkpoint-pulse" />
      <text x="18" y="4" fill="#10b981" font-size="8" font-weight="900">SECTOR 4 💳 [CLICK REPO]</text>
      <text x="18" y="17" fill="#ffffff" font-size="10.5" font-weight="900">SETTLECORE EXCHANGE</text>
      <text x="18" y="27" fill="#6ee7b7" font-size="7.5" font-weight="700">.NET 10 Payment Reconciliation</text>
    </g>
  </a>

  <!-- CHECKPOINT 6: PLANORA TEAM PADDOCK -->
  <a href="https://github.com/axzellinnovations/project_management_app" target="_blank">
    <g transform="translate(230, 360)">
      <rect x="-10" y="-12" width="160" height="44" rx="8" fill="#2d1305" stroke="#fb923c" stroke-width="1.8" />
      <circle cx="6" cy="10" r="5" fill="#fb923c" class="checkpoint-pulse" />
      <text x="18" y="4" fill="#fb923c" font-size="8" font-weight="900">SECTOR 5 👥 [CLICK REPO]</text>
      <text x="18" y="17" fill="#ffffff" font-size="10.5" font-weight="900">PLANORA TEAM PADDOCK</text>
      <text x="18" y="27" fill="#fed7aa" font-size="7.5" font-weight="700">Lead Architect • 5-Engineer Team</text>
    </g>
  </a>

  <!-- CHECKPOINT 7: OPEN SOURCE PITLANE -->
  <g transform="translate(50, 275)">
    <rect x="-10" y="-12" width="150" height="44" rx="8" fill="#0b1120" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="6" cy="10" r="5" fill="#f43f5e" class="checkpoint-pulse" />
    <text x="18" y="4" fill="#f43f5e" font-size="8" font-weight="900">PIT STOP 2 // UPSTREAM</text>
    <text x="18" y="17" fill="#ffffff" font-size="10" font-weight="800">OPEN SOURCE PITLANE</text>
    <text x="18" y="27" fill="#94a3b8" font-size="7.5" font-weight="600">Telegram, Testcontainers, Ballerina</text>
  </g>

  <!-- FINISH LINE & PODIUM (Moratuwa University GPA 3.74) -->
  <g transform="translate(380, 200)">
    <rect x="-12" y="-16" width="200" height="52" rx="10" fill="#030712" stroke="#facc15" stroke-width="2" filter="url(#pointGlow)" />
    <!-- Chequered Flag Header -->
    <rect x="-10" y="-14" width="196" height="5" fill="#facc15" />
    <circle cx="8" cy="12" r="6" fill="#facc15" />
    <text x="22" y="5" fill="#facc15" font-size="8.5" font-weight="900">🏁 THE PODIUM FINISH</text>
    <text x="22" y="20" fill="#f8fafc" font-size="11.5" font-weight="900">UNIVERSITY OF MORATUWA</text>
    <text x="22" y="31" fill="#fef08a" font-size="8.5" font-weight="800">BSc (Hons) IT • GPA 3.74 / 4.0</text>
  </g>
</svg>
