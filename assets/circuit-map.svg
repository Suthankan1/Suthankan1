<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="100%" height="100%" style="background: #090d16; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="circuitBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>

    <linearGradient id="neonTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePoint {
      0% { r: 5px; opacity: 1; }
      50% { r: 9px; opacity: 0.5; }
      100% { r: 5px; opacity: 1; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    .track-active {
      stroke-dasharray: 10, 14;
      animation: dashMove 2.2s linear infinite;
    }
    .checkpoint-pulse {
      animation: pulsePoint 1.8s ease-in-out infinite;
    }
    .hover-card {
      transition: transform 0.2s ease;
    }
    .hover-card:hover {
      filter: brightness(1.15);
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1020" height="500" fill="url(#circuitBg)" />

  <!-- Subtle Circuit Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.3">
    <line x1="100" y1="40" x2="100" y2="460" />
    <line x1="260" y1="40" x2="260" y2="460" />
    <line x1="420" y1="40" x2="420" y2="460" />
    <line x1="580" y1="40" x2="580" y2="460" />
    <line x1="740" y1="40" x2="740" y2="460" />
    <line x1="900" y1="40" x2="900" y2="460" />

    <line x1="40" y1="80" x2="980" y2="80" />
    <line x1="40" y1="180" x2="980" y2="180" />
    <line x1="40" y1="300" x2="980" y2="300" />
    <line x1="40" y1="420" x2="980" y2="420" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(45, 30)">
    <rect width="280" height="34" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f43f5e" filter="url(#pointGlow)" />
    <text x="32" y="16" fill="#f8fafc" font-size="11" font-weight="900" letter-spacing="1">SUTHANKAN GRAND PRIX</text>
    <text x="32" y="27" fill="#38bdf8" font-size="8" font-weight="700" letter-spacing="1.5">CIRCUIT TELEMETRY MAP // 2026</text>
  </g>

  <!-- Circuit Stats Badge -->
  <g transform="translate(745, 30)">
    <rect width="230" height="34" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="16" fill="#94a3b8" font-size="8" font-weight="700">TRACK LENGTH</text>
    <text x="16" y="27" fill="#10b981" font-size="9" font-weight="900">8 SECTORS • 4 PIT STOPS</text>
    <text x="140" y="16" fill="#94a3b8" font-size="8" font-weight="700">LAP RECORD</text>
    <text x="140" y="27" fill="#38bdf8" font-size="9" font-weight="900">GPA 3.74 / 4.0</text>
  </g>

  <!-- CIRCUIT TRACK PATH DEFINITION -->
  <!-- Clean, uncrowded racing line with generous margins -->
  <!-- Coordinates:
       Top straight: y=130, from x=260 to x=680
       Right hairpins: x=750, y=130 -> curve to (x=800, y=220) -> curve to (x=730, y=340)
       Bottom straight: y=340, from x=730 to x=280
       Left loop: (x=200, y=340) -> curve to (x=160, y=235) -> curve to (x=260, y=130)
  -->
  <path id="trackPath" d="M 260 135 L 680 135 C 750 135, 800 170, 800 225 C 800 280, 750 335, 680 335 L 280 335 C 200 335, 160 290, 160 235 C 160 175, 200 135, 260 135 Z" 
        fill="none" stroke="#020617" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 260 135 L 680 135 C 750 135, 800 170, 800 225 C 800 280, 750 335, 680 335 L 280 335 C 200 335, 160 290, 160 235 C 160 175, 200 135, 260 135 Z" 
        fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neon Glowing Track Rail -->
  <path d="M 260 135 L 680 135 C 750 135, 800 170, 800 225 C 800 280, 750 335, 680 335 L 280 335 C 200 335, 160 290, 160 235 C 160 175, 200 135, 260 135 Z" 
        fill="none" stroke="url(#neonTrackGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#trackGlow)" />

  <!-- Animated Active Centerline -->
  <path d="M 260 135 L 680 135 C 750 135, 800 170, 800 225 C 800 280, 750 335, 680 335 L 280 335 C 200 335, 160 290, 160 235 C 160 175, 200 135, 260 135 Z" 
        fill="none" stroke="#ffffff" stroke-width="2" class="track-active" opacity="0.8" />

  <!-- ANIMATED CAR RACING ON TRACK -->
  <g>
    <circle r="7" fill="#f43f5e" filter="url(#pointGlow)" />
    <circle r="3.5" fill="#ffffff" />
    <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trackPath" />
    </animateMotion>
  </g>

  <!-- CONNECTOR GUIDE LINES (Pinning cards cleanly to track points without overlapping) -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3, 3" opacity="0.7">
    <!-- Turn 1-2 to card -->
    <line x1="310" y1="115" x2="310" y2="135" />
    <!-- Event Chicane to card -->
    <line x1="560" y1="115" x2="560" y2="135" />
    <!-- VoltGrid to track -->
    <line x1="820" y1="180" x2="790" y2="190" />
    <!-- ProofMesh to track -->
    <line x1="820" y1="270" x2="780" y2="285" />
    <!-- SettleCore to track -->
    <line x1="590" y1="355" x2="590" y2="390" />
    <!-- Planora to track -->
    <line x1="330" y1="355" x2="330" y2="390" />
    <!-- Open Source to track -->
    <line x1="160" y1="235" x2="185" y2="235" />
  </g>

  <!-- PIT STOPS & CHECKPOINTS (Placed in dedicated clear zones) -->

  <!-- CHECKPOINT 1: THE ENGINE BAY (Java 25, Go, C# .NET) -->
  <!-- Position: Top-Left Clear Zone (y=72) -->
  <g class="hover-card" transform="translate(210, 72)">
    <rect width="180" height="42" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="21" r="5" fill="#38bdf8" class="checkpoint-pulse" />
    <text x="28" y="16" fill="#38bdf8" font-size="8" font-weight="900">TURN 1-2 // ENGINE STRAIGHT</text>
    <text x="28" y="27" fill="#f8fafc" font-size="9.5" font-weight="800">Java 25 • Go • C# .NET 10</text>
    <text x="28" y="36" fill="#94a3b8" font-size="7.5" font-weight="600">Spring Boot 4, ASP.NET Core</text>
  </g>

  <!-- CHECKPOINT 2: EVENT STREAM CHICANE (Kafka, gRPC, Outbox) -->
  <!-- Position: Top-Right Clear Zone (y=72) -->
  <g class="hover-card" transform="translate(470, 72)">
    <rect width="180" height="42" rx="8" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="21" r="5" fill="#10b981" class="checkpoint-pulse" />
    <text x="28" y="16" fill="#10b981" font-size="8" font-weight="900">SECTOR 2 // EVENT CHICANE</text>
    <text x="28" y="27" fill="#f8fafc" font-size="9.5" font-weight="800">Kafka • gRPC • Protobuf</text>
    <text x="28" y="36" fill="#94a3b8" font-size="7.5" font-weight="600">Transactional Outbox Patterns</text>
  </g>

  <!-- PIT STOP 1: VOLTGRID MEGASTATION (EV Charging Platform) -->
  <!-- Position: Far-Right Top (x=825, y=145) -->
  <a href="https://github.com/Suthankan1/voltgrid" target="_blank" class="hover-card">
    <g transform="translate(825, 145)">
      <rect width="175" height="48" rx="8" fill="#061e38" stroke="#38bdf8" stroke-width="1.8" filter="url(#pointGlow)" />
      <circle cx="16" cy="24" r="5" fill="#38bdf8" class="checkpoint-pulse" />
      <text x="28" y="16" fill="#38bdf8" font-size="8" font-weight="900">PIT STOP 1 ⚡ [CLICK REPO]</text>
      <text x="28" y="29" fill="#ffffff" font-size="11" font-weight="900">VOLTGRID EV STATION</text>
      <text x="28" y="40" fill="#7dd3fc" font-size="7.5" font-weight="700">3x Spring Microservices, OCPP 2.0.1</text>
    </g>
  </a>

  <!-- CHECKPOINT 4: PROOFMESH CITADEL (Security Hairpin) -->
  <!-- Position: Far-Right Bottom (x=825, y=240) -->
  <a href="https://github.com/Suthankan1/proofmesh" target="_blank" class="hover-card">
    <g transform="translate(825, 240)">
      <rect width="175" height="48" rx="8" fill="#1f1135" stroke="#c084fc" stroke-width="1.8" filter="url(#pointGlow)" />
      <circle cx="16" cy="24" r="5" fill="#c084fc" class="checkpoint-pulse" />
      <text x="28" y="16" fill="#c084fc" font-size="8" font-weight="900">SECTOR 3 🛡️ [CLICK REPO]</text>
      <text x="28" y="29" fill="#ffffff" font-size="11" font-weight="900">PROOFMESH CITADEL</text>
      <text x="28" y="40" fill="#e9d5ff" font-size="7.5" font-weight="700">Zero-Trust Agent Runtime, ES256</text>
    </g>
  </a>

  <!-- CHECKPOINT 5: SETTLECORE BANKING (Financial Banking) -->
  <!-- Position: Bottom-Right Clear Zone (x=500, y=390) -->
  <a href="https://github.com/Suthankan1/SettleCore" target="_blank" class="hover-card">
    <g transform="translate(500, 390)">
      <rect width="180" height="46" rx="8" fill="#04221b" stroke="#10b981" stroke-width="1.8" />
      <circle cx="16" cy="23" r="5" fill="#10b981" class="checkpoint-pulse" />
      <text x="28" y="16" fill="#10b981" font-size="8" font-weight="900">SECTOR 4 💳 [CLICK REPO]</text>
      <text x="28" y="28" fill="#ffffff" font-size="10.5" font-weight="900">SETTLECORE EXCHANGE</text>
      <text x="28" y="38" fill="#6ee7b7" font-size="7.5" font-weight="700">.NET 10 Payment Reconciliation</text>
    </g>
  </a>

  <!-- CHECKPOINT 6: PLANORA TEAM PADDOCK -->
  <!-- Position: Bottom-Left Clear Zone (x=240, y=390) -->
  <a href="https://github.com/axzellinnovations/project_management_app" target="_blank" class="hover-card">
    <g transform="translate(240, 390)">
      <rect width="180" height="46" rx="8" fill="#2d1305" stroke="#fb923c" stroke-width="1.8" />
      <circle cx="16" cy="23" r="5" fill="#fb923c" class="checkpoint-pulse" />
      <text x="28" y="16" fill="#fb923c" font-size="8" font-weight="900">SECTOR 5 👥 [CLICK REPO]</text>
      <text x="28" y="28" fill="#ffffff" font-size="10.5" font-weight="900">PLANORA TEAM PADDOCK</text>
      <text x="28" y="38" fill="#fed7aa" font-size="7.5" font-weight="700">Lead Architect • 5-Engineer Team</text>
    </g>
  </a>

  <!-- CHECKPOINT 7: OPEN SOURCE PITLANE -->
  <!-- Position: Far-Left Clear Zone (x=10, y=210) -->
  <g class="hover-card" transform="translate(10, 210)">
    <rect width="165" height="46" rx="8" fill="#0b1120" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="14" cy="23" r="4.5" fill="#f43f5e" class="checkpoint-pulse" />
    <text x="25" y="16" fill="#f43f5e" font-size="8" font-weight="900">PIT STOP 2 // UPSTREAM</text>
    <text x="25" y="28" fill="#ffffff" font-size="9.5" font-weight="800">OPEN SOURCE PITLANE</text>
    <text x="25" y="38" fill="#94a3b8" font-size="7.5" font-weight="600">Telegram, Testcontainers, Ballerina</text>
  </g>

  <!-- FINISH LINE & PODIUM (Moratuwa University GPA 3.74) -->
  <!-- Position: Generous Infield Center (x=380, y=205) -->
  <g transform="translate(370, 205)">
    <rect width="220" height="56" rx="10" fill="#030712" stroke="#facc15" stroke-width="2" filter="url(#pointGlow)" />
    <!-- Chequered Flag Accent -->
    <rect x="2" y="2" width="216" height="5" fill="#facc15" />
    <circle cx="20" cy="32" r="6" fill="#facc15" />
    <text x="34" y="23" fill="#facc15" font-size="8.5" font-weight="900">🏁 THE PODIUM FINISH</text>
    <text x="34" y="36" fill="#f8fafc" font-size="11" font-weight="900">UNIVERSITY OF MORATUWA</text>
    <text x="34" y="47" fill="#fef08a" font-size="8" font-weight="800">BSc (Hons) IT • GPA 3.74 / 4.0</text>
  </g>
</svg>
