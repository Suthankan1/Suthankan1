<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="100%" height="auto" role="img" aria-labelledby="metricsTitle">
  <title id="metricsTitle">Key Engineering Metrics</title>
  
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Metric 1: GPA -->
  <g transform="translate(0, 0)">
    <rect width="216" height="95" rx="8" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="95" rx="2" fill="#38BDF8" />
    <text x="20" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">3.74<tspan font-size="14" fill="#64748B" font-weight="500"> / 4.0</tspan></text>
    <text x="20" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Moratuwa IT Honours</text>
    <text x="20" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Top-tier academic track</text>
  </g>

  <!-- Metric 2: Flagships -->
  <g transform="translate(228, 0)">
    <rect width="216" height="95" rx="8" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="95" rx="2" fill="#818CF8" />
    <text x="20" y="38" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">4 <tspan font-size="16" fill="#A5B4FC" font-weight="600">Systems</tspan></text>
    <text x="20" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Distributed &amp; Cloud</text>
    <text x="20" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Spring Boot, Go, .NET 10, Kafka</text>
  </g>

  <!-- Metric 3: Open Source -->
  <g transform="translate(456, 0)">
    <rect width="216" height="95" rx="8" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="95" rx="2" fill="#34D399" />
    <text x="20" y="38" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">6+ <tspan font-size="16" fill="#6EE7B7" font-weight="600">PRs</tspan></text>
    <text x="20" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open-Source Upstream</text>
    <text x="20" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Telegram Desktop, Testcontainers</text>
  </g>

  <!-- Metric 4: Invariant-First -->
  <g transform="translate(684, 0)">
    <rect width="216" height="95" rx="8" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="95" rx="2" fill="#F43F5E" />
    <text x="20" y="38" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Zero-Trust</text>
    <text x="20" y="62" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Production-Minded</text>
    <text x="20" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Fail-closed &amp; OTel instrumented</text>
  </g>
</svg>
