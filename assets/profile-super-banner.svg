<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Suthankan Balenthiran - Software Engineer</title>
  <desc id="bannerDesc">Senior-level portfolio banner for Suthankan Balenthiran specializing in Backend, Distributed Systems, Security, and Cloud Architecture.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>

    <!-- Top Accent Bar Gradient -->
    <linearGradient id="accentBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="75%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Text Glow Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGradient)" />

  <!-- Ambient Glows -->
  <circle cx="1020" cy="90" r="260" fill="url(#purpleGlow)" />
  <circle cx="180" cy="180" r="280" fill="url(#glowCircle)" />

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="1200" height="360" rx="14" fill="url(#grid)" />

  <!-- Top Multi-Tone Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentBarGrad)" />

  <!-- Left Cyber Border Highlight -->
  <rect x="0" y="40" width="4" height="280" rx="2" fill="#38BDF8" opacity="0.8" />

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <g transform="translate(60, 48)">
    <!-- Role / Category Tag -->
    <g>
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#0C4A6E" fill-opacity="0.5" stroke="#0284C7" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38BDF8" />
      <text x="26" y="17" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1">DISTRIBUTED SYSTEMS &amp; CLOUD</text>
    </g>

    <!-- Full Name -->
    <text x="0" y="74" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Suthankan Balenthiran
    </text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="112" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
      Backend &amp; Platform Engineer <tspan fill="#64748B" font-weight="400">|</tspan> <tspan fill="#34D399">Distributed Architectures</tspan>
    </text>

    <!-- Short Philosophy / Descriptor -->
    <text x="0" y="145" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Designing resilient event-driven backends, transactional outboxes, zero-trust security &amp; cloud infra.
    </text>

    <!-- Education & GPA Highlight -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="490" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
        🎓 <tspan font-weight="700" fill="#FFFFFF">University of Moratuwa</tspan> · BSc (Hons) IT (2024-2028) · <tspan fill="#38BDF8" font-weight="700">GPA 3.74</tspan>
      </text>
    </g>

    <!-- Key Technical Stack Badges -->
    <g transform="translate(0, 216)">
      <!-- Java -->
      <g transform="translate(0, 0)">
        <rect width="78" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="39" y="17" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Java 25</text>
      </g>
      <!-- Go -->
      <g transform="translate(86, 0)">
        <rect width="64" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="32" y="17" text-anchor="middle" fill="#00ADD8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Go</text>
      </g>
      <!-- C# .NET -->
      <g transform="translate(158, 0)">
        <rect width="84" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="42" y="17" text-anchor="middle" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">C# / .NET 10</text>
      </g>
      <!-- Kafka -->
      <g transform="translate(250, 0)">
        <rect width="74" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="37" y="17" text-anchor="middle" fill="#F43F5E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Kafka</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(332, 0)">
        <rect width="96" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="48" y="17" text-anchor="middle" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">PostgreSQL</text>
      </g>
      <!-- AWS / Cloud -->
      <g transform="translate(436, 0)">
        <rect width="66" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="33" y="17" text-anchor="middle" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">AWS</text>
      </g>
    </g>

    <!-- Status Strip: Open to Internships -->
    <g transform="translate(0, 258)">
      <rect width="360" height="28" rx="14" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">OPEN TO SWE &amp; DEVOPS INTERNSHIPS</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: LIVE ARCHITECTURE TELEMETRY CARD ================= -->
  <g transform="translate(680, 48)">
    <!-- Terminal Window Frame -->
    <rect width="460" height="264" rx="10" fill="url(#glassCard)" stroke="#334155" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 450 0 C 455.523 0 460 4.477 460 10 L 460 36 L 0 36 Z" fill="#0F172A" />
    <line x1="0" y1="36" x2="460" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#EF4444" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" />
    <circle cx="52" cy="18" r="5" fill="#10B981" />
    <text x="230" y="22" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">system-topology.json</text>

    <!-- Architecture Visual Blueprint -->
    <g transform="translate(24, 52)">
      <!-- Line 1: Gateway -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="6" fill="#0B132B" stroke="#0284C7" stroke-width="1" />
        <text x="12" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">Enforcement Gateway</text>
        <text x="12" y="30" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">Go · ES256 Offline Claims</text>
      </g>

      <!-- Connection arrow -->
      <path d="M 180 19 L 230 19" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" />
      <polygon points="230,19 224,16 224,22" fill="#38BDF8" />

      <!-- Node 2: Control Plane -->
      <g transform="translate(232, 0)">
        <rect width="180" height="38" rx="6" fill="#0B132B" stroke="#818CF8" stroke-width="1" />
        <text x="12" y="18" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">Control Plane (Spring)</text>
        <text x="12" y="30" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">Java 25 · Modulith Policy</text>
      </g>

      <!-- Downward bus -->
      <path d="M 322 38 L 322 72 L 90 72 L 90 88" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3,3" />
      <polygon points="90,88 87,82 93,82" fill="#818CF8" />

      <!-- Node 3: Event Stream / Kafka Outbox -->
      <g transform="translate(0, 88)">
        <rect width="180" height="38" rx="6" fill="#0B132B" stroke="#F43F5E" stroke-width="1" />
        <text x="12" y="18" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">Event Stream (Kafka)</text>
        <text x="12" y="30" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">Transactional Outbox · Idempotent</text>
      </g>

      <!-- Connection arrow to DB -->
      <path d="M 180 107 L 230 107" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" />
      <polygon points="230,107 224,104 224,110" fill="#34D399" />

      <!-- Node 4: Persistence -->
      <g transform="translate(232, 88)">
        <rect width="180" height="38" rx="6" fill="#0B132B" stroke="#34D399" stroke-width="1" />
        <text x="12" y="18" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">PostgreSQL / Cloud</text>
        <text x="12" y="30" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">AWS ECS · Terraform · OTel</text>
      </g>

      <!-- Bottom Telemetry Terminal Logs -->
      <g transform="translate(0, 144)">
        <rect width="412" height="48" rx="6" fill="#050811" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">➜ [invariants] strict replay defense: ENABLED</text>
        <text x="12" y="34" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">✔ [status] 100% testcontainers passed (Spring + Go)</text>
      </g>
    </g>
  </g>
</svg>
